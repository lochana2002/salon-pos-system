<div class="dashboard-container">
  <!-- Left Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand-section">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-2.38 1.04-4.52 2.7-6 .25 1.51 1.26 3.1 2.8 4.2 1.4 1 3.2 1.8 5.5 1.8 2.3 0 4.1-.8 5.5-1.8 1.54-1.1 2.55-2.69 2.8-4.2 1.66 1.48 2.7 3.62 2.7 6 0 4.41-3.59 8-8 8z"/>
        </svg>
      </div>
      <h2>Glow & Style</h2>
      <span>SALON & BEAUTY</span>
    </div>

    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        <i class="icon">📊</i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/pos" routerLinkActive="active" class="nav-item">
        <i class="icon">🛒</i>
        <span>POS</span>
      </a>
      <a routerLink="/appointments" routerLinkActive="active" class="nav-item">
        <i class="icon">📅</i>
        <span>Appointments</span>
      </a>
      <a routerLink="/customers" routerLinkActive="active" class="nav-item">
        <i class="icon">👥</i>
        <span>Customers</span>
      </a>
      <a routerLink="/salon-services" routerLinkActive="active" class="nav-item">
        <i class="icon">✂️</i>
        <span>Services</span>
      </a>
      <a routerLink="/products" routerLinkActive="active" class="nav-item">
        <i class="icon">🛍️</i>
        <span>Products</span>
      </a>
      <a routerLink="/employees" routerLinkActive="active" class="nav-item">
        <i class="icon">👥</i>
        <span>Staff</span>
      </a>
      <a routerLink="/reports" routerLinkActive="active" class="nav-item">
        <i class="icon">📈</i>
        <span>Reports</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="nav-item">
        <i class="icon">⚙️</i>
        <span>Settings</span>
      </a>
    </nav>

    <div class="user-profile-footer">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" alt="User" class="avatar" />
      <div class="user-info">
        <span class="name">Admin</span>
        <span class="role">Salon Manager</span>
      </div>
      <span class="chevron">▼</span>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="main-wrapper">
    <!-- Top Header Bar -->
    <header class="top-header">
      <div class="global-search">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Search services, products or customers..." />
      </div>

      <div class="header-right">
        <div class="date-time">
          <span class="calendar-icon">📅</span>
          <div class="datetime-text">
            <span class="date">Oct 18, 2026</span>
            <span class="time">10:24 AM</span>
          </div>
        </div>

        <div class="notification-btn">
          <span class="bell-icon">🔔</span>
          <span class="badge">3</span>
        </div>

        <div class="header-avatar">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" alt="Profile" />
        </div>
      </div>
    </header>

    <!-- Page Content View -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
