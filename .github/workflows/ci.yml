
name: Salon POS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build

  backend:
    name: Build ASP.NET Core API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up .NET
  uses: actions/setup-dotnet@v4
  with:
    dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore backend/SalonPOS.API/SalonPOS.API.csproj

      - name: Build API
        run: dotnet build backend/SalonPOS.API/SalonPOS.API.csproj --configuration Release --no-restore
